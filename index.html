<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星天水镜 · 圣遗物评分</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/miao.css">
</head>
<body>

<header class="top" id="top">
  <div class="brand">
    <span class="mark">✦</span>
    <div>
      <h1 id="brandName">星天水镜</h1>
      <p id="brandSub">seiten-suikyou · 圣遗物评分</p>
    </div>
  </div>

  <form class="query" id="query">
    <label class="field">
      <span id="uidLabel">UID</span>
      <input id="uid" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="101242308">
    </label>
    <button type="submit" class="btn primary" id="load">读取</button>
    <button type="button" class="btn" id="fetch" title="联网从 enka 重新抓一次">抓取</button>
    <label class="field">
      <span id="localeLabel">语言</span>
      <select id="locale"></select>
    </label>
  </form>
</header>

<div class="banner" id="banner" hidden></div>

<main class="app" id="app">
  <div id="view-roster" class="view active"></div>
  <div id="view-detail" class="view"></div>
</main>

<footer class="foot">
  <span class="dim" id="footmeta"></span>
</footer>

<script src="/app.js"></script>
</body>
</html>
