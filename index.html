<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星天水镜 · 圣遗物评分</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="mark">✦</span>
    <div>
      <h1 id="brandName">星天水镜</h1>
      <p id="brandSub">seiten-suikyou · 圣遗物评分</p>
    </div>
  </div>

  <form class="query" id="query">
    <label class="field">
      <span id="uidLabel">UID</span>
      <input id="uid" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="101242308">
    </label>
    <button type="submit" class="btn primary" id="load">读取</button>
    <button type="button" class="btn" id="fetch" title="联网从 enka 重新抓一次">抓取</button>
    <label class="field">
      <span id="localeLabel">语言</span>
      <select id="locale"></select>
    </label>
  </form>
</header>

<div class="banner" id="banner" hidden></div>

<main class="layout">

  <aside class="rail">
    <section class="acct" id="acct"></section>
    <section class="uids" id="uids"></section>
    <ol class="charlist" id="charlist"></ol>
  </aside>

  <section class="detail" id="detail">
    <div class="placeholder" data-idle>
      <p>还没有数据。</p>
      <p class="dim">输入 UID 点「读取」（读本地库），或点「抓取」从 enka 现拉一份。</p>
    </div>
  </section>

</main>

<footer class="foot">
  <span id="footnote">评分内核来自 miao-plugin，分数与上游逐字一致</span>
  <span class="dim" id="footmeta"></span>
</footer>

<template id="tpl-char">
  <li class="char" tabindex="0">
    <span class="rank"></span>
    <div class="cinfo">
      <b class="cname"></b>
      <span class="csub"></span>
    </div>
    <div class="cscore"><b></b><span></span></div>
  </li>
</template>

<template id="tpl-arti">
  <article class="arti">
    <div class="ahead">
      <span class="pos"></span>
      <div class="atitle">
        <b class="aname"></b>
        <span class="aset"></span>
      </div>
      <div class="ascore">
        <span class="ring"></span>
        <b class="amark"></b>
        <span class="aclass"></span>
      </div>
    </div>
    <div class="amain">
      <span class="mlabel" id="mainStat">主词条</span>
      <b class="mkey"></b>
      <span class="mval"></span>
    </div>
    <ul class="subs"></ul>
  </article>
</template>

<script src="/app.js"></script>
</body>
</html>
