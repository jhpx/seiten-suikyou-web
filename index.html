<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星天水镜 · 圣遗物评分</title>
<!-- 页面自身的引用一律写**相对路径**：GitHub Pages 的项目站挂在 /<repo>/ 下面，
     写成 /style.css 会指到域名根上去，直接 404。 -->
<!-- 样式按「基础层 → 通用组件 → 页面模块 → 明细页评分卡」拆分。
     ⚠️ 下面的顺序就是层叠顺序：后加载的文件会覆盖前面同特异性的规则，
        调整顺序会改变显示效果。每个模块的职责和来源写在 css/ 文件头。 -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/form.css">
<link rel="stylesheet" href="css/button.css">
<link rel="stylesheet" href="css/topbar.css">
<link rel="stylesheet" href="css/region.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/advice.css">
<link rel="stylesheet" href="css/dialog.css">
<link rel="stylesheet" href="css/filter.css">
<link rel="stylesheet" href="css/char-card.css">
<link rel="stylesheet" href="css/page-states.css">
<link rel="stylesheet" href="css/sim.css">
<link rel="stylesheet" href="css/rubric.css">
<link rel="stylesheet" href="css/detail-base.css">
<link rel="stylesheet" href="css/score-card.css">
<link rel="stylesheet" href="css/item-card.css">
<link rel="stylesheet" href="css/damage.css">
</head>
<body>

<!-- .shell / .shell-in：整页按 616（600 内容 + 两侧 8 内边距）排一次版，屏幕比它窄就整体等比缩小 ——
     版式在任何设备上完全一样，只有倍率不同。倍率由 bootstrap.js 的 fitShell() 写进 .shell-in 的 transform。 -->
<div class="shell" id="shell"><div class="shell-in" id="shellIn">

<header class="top" id="top">
  <div class="brand">
    <span class="mark">✦</span>
    <div>
      <h1 id="brandName">星天水镜</h1>
      <p id="brandSub">seiten-suikyou · 圣遗物评分</p>
    </div>
  </div>

  <form class="query" id="query">
    <label class="field uid">
      <span id="uidLabel">UID</span>
      <input id="uid" name="uid" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="101242308" list="uidHistory">
    </label>
    <!-- 历史 UID 由前端脚本用 localStorage 维护（原生 autocomplete 对 preventDefault 的表单不可靠） -->
    <datalist id="uidHistory"></datalist>
    <button type="button" class="btn primary" id="fetch">刷新</button>
    <label class="field locale">
      <span id="localeLabel">语言</span>
      <select id="locale"></select>
    </label>
  </form>

  <!-- 各区分服在线状态：后端周期拉 status.enka.network 缓存在 /api/health，前端进页面读一次，直接铺开显示 -->
  <div class="src-line">
    <span class="src-regions" id="src-regions" role="status" aria-live="polite"></span>
  </div>
</header>

<div class="banner" id="banner" hidden></div>

<main class="app" id="app">
  <div id="view-roster" class="view active"></div>
  <div id="view-detail" class="view"></div>
  <!-- 模拟比对页：与明细页同级的第三个视图，由 core.showView('sim') 切换 -->
  <div id="view-sim" class="view"></div>
</main>

<footer class="foot">
  <span class="dim" id="footmeta"></span>
</footer>

</div></div><!-- /shell-in /shell -->

<script type="module" src="bootstrap.js"></script>
</body>
</html>
